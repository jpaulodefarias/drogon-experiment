services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: drogon
      POSTGRES_USER: drogon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drogon -d drogon"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: drogon-experiment:local
    command: ["sh", "scripts/migrate.sh"]
    environment: &database_environment
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: drogon
      DATABASE_USER: drogon
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: drogon-experiment:local
    build: .
    environment:
      <<: *database_environment
      HTTP_PORT: "8080"
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
