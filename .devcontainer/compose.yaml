services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspaces/drogon-experiment
    ports:
      - "8080:8080"
    volumes:
      - ..:/workspaces/drogon-experiment:cached
      - conan-cache:/home/ubuntu/.conan2
    environment:
      CC: clang
      CXX: clang++
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: drogon
      DATABASE_USER: drogon
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      HTTP_PORT: "8080"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    command: sleep infinity

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: drogon
      POSTGRES_USER: drogon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drogon -d drogon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conan-cache:
  postgres-data:
